name: Income Model CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'data/**.dvc'
      - 'src/**.py'
      - 'params.yaml'
  workflow_dispatch:

jobs:

  # ---------------------------------------------------------------------------
  # JOB 1 - UNIT TEST
  # Chay unit tests tren du lieu ao (khong can ket noi cloud storage).
  # Neu co bat ky test nao that bai, pipeline dung lai o day va khong tien hanh
  # huan luyen hay trien khai.
  # ---------------------------------------------------------------------------
  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: pytest tests/ -v


  # ---------------------------------------------------------------------------
  # JOB 2 - TRAIN
  # Xac thuc cloud storage, pull du lieu bang DVC, huan luyen mo hinh, upload artifact.
  # Chi chay khi Job 1 (Unit Test) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  train:
    name: Train
    needs: unit-test
    runs-on: ubuntu-latest
    outputs:
      f1: ${{ steps.read_report.outputs.f1 }}
      should_deploy: ${{ steps.compare_model.outputs.should_deploy }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Authenticate to Cloud Storage
        env:
          STORAGE_CREDENTIALS: ${{ secrets.STORAGE_CREDENTIALS }}
        run: |
          AK=$(python -c "import json,os; print(json.loads(os.environ['STORAGE_CREDENTIALS'])['aws_access_key_id'])")
          SK=$(python -c "import json,os; print(json.loads(os.environ['STORAGE_CREDENTIALS'])['aws_secret_access_key'])")
          echo "AWS_ACCESS_KEY_ID=$AK" >> $GITHUB_ENV
          echo "AWS_SECRET_ACCESS_KEY=$SK" >> $GITHUB_ENV
          echo "AWS_DEFAULT_REGION=us-east-1" >> $GITHUB_ENV

      - name: Pull data with DVC
        run: dvc pull data/train_batch1.csv data/holdout.csv

      - name: Train model
        run: python src/train.py

      - name: Read report
        id: read_report
        run: |
          F1=$(python -c "import json; d=json.load(open('outputs/report.json')); print(d['f1_score'])")
          echo "f1=$F1" >> $GITHUB_OUTPUT

      - name: Compare with previous model version
        id: compare_model
        env:
          ARTIFACT_BUCKET: ${{ secrets.ARTIFACT_BUCKET }}
        run: |
          python - <<'PYEOF'
          import boto3
          import json
          import os
          from botocore.exceptions import ClientError

          bucket = os.environ["ARTIFACT_BUCKET"]
          client = boto3.client("s3")

          new_f1 = json.load(open("outputs/report.json"))["f1_score"]

          old_f1 = None
          try:
              client.download_file(bucket, "artifacts/current/report.json", "/tmp/old_report.json")
              old_f1 = json.load(open("/tmp/old_report.json"))["f1_score"]
          except ClientError:
              print("Khong tim thay report.json cua phien ban truoc, coi nhu day la lan trien khai dau tien.")

          if old_f1 is None:
              should_deploy = True
              print(f"F1 moi: {new_f1:.4f}. Chua co phien ban truoc de so sanh -> trien khai.")
          else:
              should_deploy = new_f1 >= old_f1
              print(f"F1 cu: {old_f1:.4f} | F1 moi: {new_f1:.4f} -> should_deploy={should_deploy}")

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"should_deploy={'true' if should_deploy else 'false'}\n")
          PYEOF

      - name: Upload model to Cloud Storage
        env:
          ARTIFACT_BUCKET: ${{ secrets.ARTIFACT_BUCKET }}
        run: |
          python - <<'PYEOF'
          import boto3
          import os

          bucket = os.environ["ARTIFACT_BUCKET"]
          client = boto3.client("s3")
          client.upload_file("models/model.joblib", bucket, "artifacts/current/model.joblib")
          client.upload_file("outputs/report.json", bucket, "artifacts/current/report.json")
          print(f"Model va report uploaded to s3://{bucket}/artifacts/current/")
          PYEOF

      - name: Save report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: outputs/report.json

      - name: Save detail report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: detail
          path: outputs/detail.txt


  # ---------------------------------------------------------------------------
  # JOB 3 - QUALITY GATE
  # Kiem tra nguong chat luong (f1_score >= 0.65).
  # Pipeline dung lai o day neu mo hinh chua dat yeu cau.
  #
  # Luu y: nguong o day dat tren f1_score chu KHONG phai accuracy. Bo du lieu
  # Adult co ty le lop 75/25, nen mot mo hinh doan bua "thu nhap thap" cho moi
  # mau da dat accuracy 0.75 ma hoan toan vo dung.
  # Chi chay khi Job 2 (Train) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  quality-gate:
    name: Quality Gate
    needs: train
    runs-on: ubuntu-latest
    steps:

      - name: Check quality gate
        run: |
          python - <<'PYEOF'
          f1 = float("${{ needs.train.outputs.f1 }}")
          should_deploy = "${{ needs.train.outputs.should_deploy }}" == "true"

          if f1 < 0.65:
              raise SystemExit(f"FAILED: f1_score {f1:.4f} < 0.65. Huy trien khai.")
          if not should_deploy:
              raise SystemExit(
                  f"FAILED: f1_score {f1:.4f} thap hon phien ban dang chay. Huy trien khai (rollback)."
              )
          print(f"PASSED: f1_score {f1:.4f} >= 0.65 va >= phien ban truoc. Dang trien khai model.")
          PYEOF


  # ---------------------------------------------------------------------------
  # JOB 4 - RELEASE
  # Trien khai len VM qua SSH.
  # Chi chay khi Job 3 (Quality Gate) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  release:
    name: Release
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:

      - name: SSH deploy to VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            sudo systemctl restart income-api
            sleep 5
            curl -sf http://localhost:8080/healthz && echo "Health check passed." || exit 1
